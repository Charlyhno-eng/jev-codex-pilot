# Codex models available to JEV. The keys are stable routing names shown in the app;
# the values are the model IDs passed to Codex. Keep models ordered from lighter to stronger.
[models]
luna = "gpt-6-luna"
sol = "gpt-6-sol"
astra = "gpt-6-astra"

# Reasoning choices are ordered from lowest to highest effort.
[reasoning]
levels = ["low", "medium", "high", "xhigh", "max"]

# Each level from 1 to 5 lists permitted model:effort pairs. The first pair is JEV's default.
# Edit model IDs above, then these routes when models or recommendations change.
[complexity.1]
routes = ["luna:medium"]

[complexity.2]
routes = ["luna:high"]

[complexity.3]
routes = ["luna:max"]

[complexity.4]
routes = ["sol:high"]

[complexity.5]
routes = ["sol:xhigh"]
